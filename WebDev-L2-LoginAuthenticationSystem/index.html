<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Login to open your dashboard.</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" required placeholder="you@example.com">
      <label>Password</label>
      <input id="loginPassword" type="password" required placeholder="Your password">
      <p id="loginMessage" class="message"></p>
      <button type="submit">Login</button>
    </form>
    <p class="switch">New here? <a href="register.html">Create an account</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
